<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <title>Quản Trị – Cây Trà Nguyện Ước</title>
    <script type="text/javascript">
      (function() {
        var l = window.location;
        var path = l.pathname.replace(/\/admin\/?$/i, '');
        var target = l.protocol + '//' + l.host + (path ? path : '') + '/?view=admin' + (l.hash || '');
        l.replace(target);
      })();
    </script>
  </head>
  <body style="background-color: #07150E; color: #F7F5EB; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="color: #D7AE48;">Quản Trị Sự Kiện</h2>
      <p style="opacity: 0.8;">Đang mở bảng quản trị...</p>
    </div>
  </body>
</html>
