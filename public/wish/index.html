<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <title>Gửi Điều Ước – Cây Trà Nguyện Ước</title>
    <script type="text/javascript">
      (function() {
        var l = window.location;
        var path = l.pathname.replace(/\/wish\/?$/i, '');
        var target = l.protocol + '//' + l.host + (path ? path : '') + '/?view=wish' + (l.hash || '');
        l.replace(target);
      })();
    </script>
  </head>
  <body style="background-color: #002B49; color: #FAF8F2; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="color: #FDB913;">Gửi Điều Ước Di Động</h2>
      <p style="opacity: 0.8;">Đang tải giao diện gửi điều ước...</p>
    </div>
  </body>
</html>
